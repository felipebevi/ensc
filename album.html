<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos e Vídeos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #343a40;
            color: #ffffff;
        }
        .gallery {
            margin-top: 20px;
        }
        .gallery img, .gallery video {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }
        .gallery-item {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-4">Galeria de Fotos e Vídeos</h1>
        
        <h2 class="mt-5">Fotos</h2>
        <div id="photo-gallery" class="row gallery">
            <!-- Fotos serão carregadas aqui -->
        </div>

        <h2 class="mt-5">Vídeos</h2>
        <div id="video-gallery" class="row gallery">
            <!-- Vídeos serão carregados aqui -->
        </div>
    </div>

    <script>
        const repoOwner = "felipebevi";
        const repoName = "ensc";
        const branch = "main";
        const photoDirs = ["11do11", "12do11", "17do11", "19do11", "3do11", "4do11", "5do11", "ViagemFormatura", "fotos1", "fotos2", "fotos3", "hopihari", "niverthassia", "sitioevaldo", "sitioosmar"];
        const basePathPhotos = "vcd/FOTOS/";
        const basePathVideos = "vcd/VIDEOS/";

        function fetchFilesFromGitHub(path, callback) {
            const apiURL = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}?ref=${branch}`;
            $.getJSON(apiURL, function(data) {
                if (Array.isArray(data)) {
                    callback(data);
                } else {
                    console.error("Erro ao carregar os arquivos do GitHub:", data);
                }
            });
        }

        // Carregar fotos dinamicamente
        $.each(photoDirs, function(index, dir) {
            fetchFilesFromGitHub(`${basePathPhotos}${dir}`, function(files) {
                $.each(files, function(i, file) {
                    if (file.name.match(/\.(jpe?g|png|gif)$/i)) {
                        $('#photo-gallery').append(`
                            <div class="col-lg-3 col-md-4 col-sm-6 gallery-item">
                                <img src="${file.download_url}" class="img-fluid" alt="${file.name}">
                            </div>
                        `);
                    }
                });
            });
        });

        // Carregar vídeos dinamicamente
        fetchFilesFromGitHub(basePathVideos, function(files) {
            $.each(files, function(i, file) {
                if (file.name.match(/\.(mp4|avi|mpg|mpeg)$/i)) {
                    $('#video-gallery').append(`
                        <div class="col-lg-4 col-md-6 col-sm-12 gallery-item">
                            <video controls>
                                <source src="${file.download_url}" type="video/mp4">
                                Seu navegador não suporta a reprodução de vídeos.
                            </video>
                        </div>
                    `);
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
