<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Fotos e Vídeos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background-color: #343a40;
            color: #ffffff;
        }
        .gallery {
            margin-top: 20px;
        }
        .gallery img, .gallery video {
            max-width: 100%;
            height: auto;
            margin-bottom: 15px;
        }
        .gallery-item {
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mt-4">Galeria de Fotos e Vídeos</h1>
        
        <h2 class="mt-5">Fotos</h2>
        <div id="photo-gallery" class="row gallery">
            <!-- Fotos serão carregadas aqui -->
        </div>

        <h2 class="mt-5">Vídeos</h2>
        <div id="video-gallery" class="row gallery">
            <!-- Vídeos serão carregados aqui -->
        </div>
    </div>

    <script>
        // Subdiretórios de fotos
        const photoDirs = ["11do11", "12do11", "17do11", "19do11", "3do11", "4do11", "5do11", "ViagemFormatura", "fotos1", "fotos2", "fotos3", "hopihari", "niverthassia", "sitioevaldo", "sitioosmar"];

        // Caminho base do projeto
        const basePath = "vcd/";

        // Carregar fotos dinamicamente
        $.each(photoDirs, function(index, dir) {
            $.ajax({
                url: `${basePath}FOTOS/${dir}`,
                success: function(data) {
                    $(data).find("a").each(function() {
                        let fileName = $(this).attr("href");
                        if (fileName.match(/\.(jpe?g|png|gif)$/i)) {
                            $('#photo-gallery').append(`
                                <div class="col-lg-3 col-md-4 col-sm-6 gallery-item">
                                    <img src="${basePath}FOTOS/${dir}/${fileName}" class="img-fluid" alt="${fileName}">
                                </div>
                            `);
                        }
                    });
                }
            });
        });

        // Carregar vídeos dinamicamente
        $.ajax({
            url: `${basePath}VIDEOS/`,
            success: function(data) {
                $(data).find("a").each(function() {
                    let fileName = $(this).attr("href");
                    if (fileName.match(/\.(mp4|avi|mpg|mpeg)$/i)) {
                        $('#video-gallery').append(`
                            <div class="col-lg-4 col-md-6 col-sm-12 gallery-item">
                                <video controls>
                                    <source src="${basePath}VIDEOS/${fileName}" type="video/mp4">
                                    Seu navegador não suporta a reprodução de vídeos.
                                </video>
                            </div>
                        `);
                    }
                });
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
